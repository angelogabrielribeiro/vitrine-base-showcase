name: Adjust Maison desktop timeout

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/adjust-maison-desktop-timeout.py"
      - ".github/workflows/adjust-maison-desktop-timeout.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0
      - run: python scripts/adjust-maison-desktop-timeout.py
      - name: Commit validation adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-maison-scroll-layout.mjs
          git commit -m "Ajusta limite da regressão desktop Maison"
          git push origin HEAD:fix/maison-scroll-layout-stage
