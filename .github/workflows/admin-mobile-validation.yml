name: Admin mobile validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: >-
          bunx prettier --check
          src/components/ui/table.tsx
          'src/routes/demo.$storeSlug.admin.tsx'
          'src/routes/demo.$storeSlug.admin.produtos.tsx'
          'src/routes/demo.$storeSlug.admin.pedidos.index.tsx'
          'src/routes/demo.$storeSlug.admin.agendamentos.tsx'

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
