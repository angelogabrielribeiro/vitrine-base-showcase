name: Apply final production fixes

on:
  push:
    branches:
      - fix/final-production-defects
    paths:
      - ".github/workflows/apply-final-production-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-defects
          fetch-depth: 0

      - name: Patch verified defects
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected fragment missing in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          # Menu mobile: transição atômica, sem fechamento no efeito inicial e com fallback DOM imediato.
          menu_path = Path("src/components/storefront/liquid-mobile-menu.tsx")
          menu = menu_path.read_text(encoding="utf-8")
          menu = menu.replace(
              'import { useEffect, useId, useRef, useState } from "react";',
              'import { useCallback, useEffect, useId, useRef } from "react";',
              1,
          )
          old_state = '''  const { menuOpen: open, setMenuOpen: setOpen } = useMobileMenuState();

  useEffect(() => () => setOpen(false), [setOpen]);

  // Fecha ao navegar
  useEffect(() => {
    setOpen(false);
  }, [pathname, setOpen]);
'''
          new_state = '''  const { menuOpen: open, setMenuOpen: setOpen } = useMobileMenuState();
  const previousPathname = useRef(pathname);

  const updateOpen = useCallback(
    (next: boolean) => {
      setOpen(next);
      if (typeof document === "undefined") return;

      const root = document.documentElement;
      if (next) root.dataset.mobileMenuOpen = "true";
      else delete root.dataset.mobileMenuOpen;

      const fab = document.querySelector<HTMLAnchorElement>(
        'a[data-whatsapp-fab][aria-label="Falar no WhatsApp"]',
      );
      if (!fab) return;

      if (next) {
        fab.setAttribute("aria-hidden", "true");
        fab.setAttribute("tabindex", "-1");
        fab.style.pointerEvents = "none";
        fab.style.visibility = "hidden";
        fab.style.opacity = "0";
      } else {
        fab.removeAttribute("aria-hidden");
        fab.removeAttribute("tabindex");
        fab.style.removeProperty("pointer-events");
        fab.style.removeProperty("visibility");
        fab.style.removeProperty("opacity");
      }
    },
    [setOpen],
  );

  useEffect(
    () => () => {
      if (typeof document === "undefined") return;
      delete document.documentElement.dataset.mobileMenuOpen;
      const fab = document.querySelector<HTMLAnchorElement>('a[data-whatsapp-fab]');
      fab?.removeAttribute("aria-hidden");
      fab?.removeAttribute("tabindex");
      fab?.style.removeProperty("pointer-events");
      fab?.style.removeProperty("visibility");
      fab?.style.removeProperty("opacity");
    },
    [],
  );

  // Fecha somente quando a rota realmente muda; não disputa com o primeiro toque.
  useEffect(() => {
    if (previousPathname.current === pathname) return;
    previousPathname.current = pathname;
    updateOpen(false);
  }, [pathname, updateOpen]);
'''
          if old_state not in menu:
              raise SystemExit("Mobile menu state block not found")
          menu = menu.replace(old_state, new_state, 1)
          menu = menu.replace('e.key === "Escape" && setOpen(false)', 'e.key === "Escape" && updateOpen(false)')
          menu = menu.replace('setOpen(false);\n    };', 'updateOpen(false);\n    };', 1)
          menu = menu.replace('  }, [open, setOpen]);', '  }, [open, updateOpen]);', 1)
          menu = menu.replace('onClick={() => setOpen(true)}', 'onClick={() => updateOpen(true)}')
          menu = menu.replace('onClick={() => setOpen(false)}', 'onClick={() => updateOpen(false)}')
          menu = menu.replace(
              '      ref={containerRef}\n      className="fixed inset-x-0 bottom-4',
              '      ref={containerRef}\n      data-mobile-menu-open={open ? "true" : "false"}\n      className="fixed inset-x-0 bottom-4',
              1,
          )
          menu_path.write_text(menu, encoding="utf-8")

          # FAB: marcador estável para fallback CSS/DOM.
          replace(
              "src/components/storefront/whatsapp-fab.tsx",
              '      aria-label="Falar no WhatsApp"\n      aria-hidden={menuOpen ? true : undefined}',
              '      aria-label="Falar no WhatsApp"\n      data-whatsapp-fab\n      aria-hidden={menuOpen ? true : undefined}',
          )

          # Header: inputs explicitamente hydration-safe.
          header_path = Path("src/components/storefront/store-header.tsx")
          header = header_path.read_text(encoding="utf-8")
          desktop_input = '''              <Input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar"
                className="h-9 w-56 pl-8"
                aria-label="Buscar"
              />'''
          desktop_fixed = '''              <Input
                suppressHydrationWarning
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar"
                className="h-9 w-56 pl-8"
                aria-label="Buscar"
                style={{ caretColor: "auto" }}
              />'''
          mobile_input = '''              <Input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar produtos"
                className="pl-8"
                autoFocus
              />'''
          mobile_fixed = '''              <Input
                suppressHydrationWarning
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar produtos"
                className="pl-8"
                style={{ caretColor: "auto" }}
                autoFocus
              />'''
          if desktop_input not in header or mobile_input not in header:
              raise SystemExit("Store header input blocks not found")
          header = header.replace(desktop_input, desktop_fixed, 1).replace(mobile_input, mobile_fixed, 1)
          header_path.write_text(header, encoding="utf-8")

          # Cards: animação in-view também no modo economy e título protegido contra overhang da fonte.
          card_path = Path("src/components/storefront/product-card.tsx")
          card = card_path.read_text(encoding="utf-8")
          card = card.replace(
              '''      capabilities.coarsePointer &&
      capabilities.quality !== "static" &&
      capabilities.quality !== "economy" &&
      inView);''',
              '''      capabilities.coarsePointer &&
      capabilities.quality !== "static" &&
      inView);''',
              1,
          )
          card = card.replace(
              '      data-in-view={String(inView && capabilities.quality !== "economy")}\n      className=',
              '      data-in-view={String(inView && capabilities.quality !== "static")}\n      data-ambient-card\n      className=',
              1,
          )
          card = card.replace(
              '          <h3 className="font-display mt-1 line-clamp-2 text-base leading-tight sm:text-lg">',
              '          <h3 className="font-display mt-1 line-clamp-2 break-words pl-1 text-base leading-tight sm:text-lg">',
              1,
          )
          card_path.write_text(card, encoding="utf-8")

          # Home: footer acima de qualquer camada visual fixa e com safe-area real.
          replace(
              "src/routes/index.tsx",
              '<footer className="border-t border-white/10 bg-vb-deep px-5 py-8 text-xs text-white/38 sm:px-8 lg:px-12">',
              '<footer className="relative z-[60] border-t border-white/10 bg-vb-deep px-5 pb-[calc(2rem+env(safe-area-inset-bottom))] pt-8 text-xs text-white/38 sm:px-8 lg:px-12">',
          )

          # Fallback CSS imediato do menu, limitado ao mobile.
          css_path = Path("src/mobile-vitrine-overrides.css")
          css = css_path.read_text(encoding="utf-8")
          fallback_css = '''

@media (max-width: 767px) {
  html[data-mobile-menu-open="true"] a[data-whatsapp-fab] {
    visibility: hidden !important;
    pointer-events: none !important;
    opacity: 0 !important;
    transform: scale(0.9) !important;
  }
}
'''
          if 'html[data-mobile-menu-open="true"] a[data-whatsapp-fab]' not in css:
              css_path.write_text(css.rstrip() + fallback_css + "\n", encoding="utf-8")

          # NovaCore: pausa manual observável e teste determinístico.
          electronics_path = Path("src/components/storefront/electronics-storefront.tsx")
          electronics = electronics_path.read_text(encoding="utf-8")
          electronics = electronics.replace(
              'import { useEffect, useMemo, useState, type PointerEvent as ReactPointerEvent } from "react";',
              'import { useCallback, useEffect, useMemo, useRef, useState, type PointerEvent as ReactPointerEvent } from "react";',
              1,
          )
          electronics = electronics.replace(
              '''  const [active, setActive] = useState(0);
  const [paused, setPaused] = useState(false);
  const current = store.categories[active] ?? store.categories[0];''',
              '''  const [active, setActive] = useState(0);
  const [hoverPaused, setHoverPaused] = useState(false);
  const [manualPaused, setManualPaused] = useState(false);
  const manualPauseTimer = useRef<number | null>(null);
  const current = store.categories[active] ?? store.categories[0];''',
              1,
          )
          electronics = electronics.replace(
              '''  useEffect(() => {
    if (reduceMotion || paused || store.categories.length < 2) return;
    const interval = window.setInterval(() => {
      setActive((value) => (value + 1) % store.categories.length);
    }, 3200);
    return () => window.clearInterval(interval);
  }, [paused, reduceMotion, store.categories.length]);

  if (!current) return null;''',
              '''  const selectCategory = useCallback((index: number) => {
    setActive(index);
    setManualPaused(true);
    if (manualPauseTimer.current != null) window.clearTimeout(manualPauseTimer.current);
    manualPauseTimer.current = window.setTimeout(() => {
      setManualPaused(false);
      manualPauseTimer.current = null;
    }, 6500);
  }, []);

  useEffect(() => {
    if (reduceMotion || hoverPaused || manualPaused || store.categories.length < 2) return;
    const interval = window.setInterval(() => {
      setActive((value) => (value + 1) % store.categories.length);
    }, 3200);
    return () => window.clearInterval(interval);
  }, [hoverPaused, manualPaused, reduceMotion, store.categories.length]);

  useEffect(
    () => () => {
      if (manualPauseTimer.current != null) window.clearTimeout(manualPauseTimer.current);
    },
    [],
  );

  if (!current) return null;''',
              1,
          )
          electronics = electronics.replace('onMouseEnter={() => setPaused(true)}', 'onMouseEnter={() => setHoverPaused(true)}', 1)
          electronics = electronics.replace('onMouseLeave={() => setPaused(false)}', 'onMouseLeave={() => setHoverPaused(false)}', 1)
          electronics = electronics.replace(
              '''                  onFocus={() => setActive(index)}
                  onClick={() => setActive(index)}
                  className={''',
              '''                  onFocus={() => selectCategory(index)}
                  onClick={() => selectCategory(index)}
                  data-category-active={isActive ? "true" : "false"}
                  aria-pressed={isActive}
                  className={''',
              1,
          )
          electronics = electronics.replace(
              '            className="relative z-20 grid gap-4 border border-white/10',
              '            data-active-category={current.slug}\n            className="relative z-20 grid gap-4 border border-white/10',
              1,
          )
          electronics_path.write_text(electronics, encoding="utf-8")

          # Validação mobile: painel deve permanecer aberto e screenshots não dependem de layout estável infinito.
          mobile_test = Path("scripts/validate-mobile-vitrines.mjs")
          test = mobile_test.read_text(encoding="utf-8")
          test = test.replace(
              '''  await menuButton.click();
  await page.waitForTimeout(450);

  const hiddenState = await fab.evaluate((element) => {''',
              '''  await menuButton.click();
  const panel = page.getByRole("menu", { name: "Menu principal" });
  await panel.waitFor({ state: "visible", timeout: 5_000 });
  await page.waitForTimeout(250);

  const hiddenState = await fab.evaluate((element) => {''',
              1,
          )
          test = test.replace(
              '''      await page.screenshot({
        path: path.join(screenshotDir, `${label}.png`),
        fullPage: true,
      });''',
              '''      await page.screenshot({
        path: path.join(screenshotDir, `${label}.png`),
        fullPage: false,
        animations: "disabled",
        caret: "hide",
        timeout: 60_000,
      });''',
              1,
          )
          test = test.replace(
              '''        .screenshot({
          path: path.join(screenshotDir, `${label}-failure.png`),
          fullPage: true,
        })''',
              '''        .screenshot({
          path: path.join(screenshotDir, `${label}-failure.png`),
          fullPage: false,
          animations: "disabled",
          caret: "hide",
          timeout: 60_000,
        })''',
              1,
          )
          mobile_test.write_text(test, encoding="utf-8")

          # Teste NovaCore escolhe uma categoria diferente e observa estado sem depender da rotação automática.
          nova_test = Path("scripts/validate-novacore.mjs")
          nova = nova_test.read_text(encoding="utf-8")
          old_category_test = '''    const firstActive = await categoryButtons.evaluateAll((buttons) =>
      buttons.findIndex((button) => button.className.includes("border-cyan-200")),
    );
    await categoryButtons.nth(2).click();
    await page.waitForTimeout(650);
    const nextActive = await categoryButtons.evaluateAll((buttons) =>
      buttons.findIndex((button) => button.className.includes("border-cyan-200")),
    );
    assert(firstActive !== nextActive, "Seleção de categoria não alterou a cena");'''
          new_category_test = '''    const firstActive = await categoryButtons.evaluateAll((buttons) =>
      buttons.findIndex((button) => button.getAttribute("data-category-active") === "true"),
    );
    assert(firstActive >= 0, "Categoria ativa inicial não está observável no DOM");
    const targetIndex = (firstActive + 1) % (await categoryButtons.count());
    await categoryButtons.nth(targetIndex).click();
    await page.waitForFunction(
      ({ targetIndex }) => {
        const buttons = [...document.querySelectorAll('[data-category-active]')];
        return buttons[targetIndex]?.getAttribute("data-category-active") === "true";
      },
      { targetIndex },
      { timeout: 5_000 },
    );
    const nextActive = await categoryButtons.evaluateAll((buttons) =>
      buttons.findIndex((button) => button.getAttribute("data-category-active") === "true"),
    );
    assert(nextActive === targetIndex, "Seleção de categoria não alterou a cena");'''
          if old_category_test not in nova:
              raise SystemExit("NovaCore category test block not found")
          nova_test.write_text(nova.replace(old_category_test, new_category_test, 1), encoding="utf-8")
          PY

      - name: Format and validate patch
        run: |
          npm install --no-audit --no-fund
          npx prettier --write \
            src/components/storefront/liquid-mobile-menu.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            src/components/storefront/store-header.tsx \
            src/components/storefront/product-card.tsx \
            src/components/storefront/electronics-storefront.tsx \
            src/routes/index.tsx \
            src/mobile-vitrine-overrides.css \
            scripts/validate-mobile-vitrines.mjs \
            scripts/validate-novacore.mjs
          npx eslint \
            src/components/storefront/liquid-mobile-menu.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            src/components/storefront/store-header.tsx \
            src/components/storefront/product-card.tsx \
            src/components/storefront/electronics-storefront.tsx \
            src/routes/index.tsx
          npm run build

      - name: Commit patch
        run: |
          git rm .github/workflows/apply-final-production-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final mobile production defects"
          git push origin HEAD:fix/final-production-defects
