name: Apply final production fixes

on:
  push:
    branches:
      - fix/final-production-defects
    paths:
      - ".github/workflows/apply-final-production-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-defects
          fetch-depth: 2

      - name: Apply patch embedded in parent workflow
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/apply-final-production-fixes.yml"],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format and validate patch"
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit("Embedded patch block not found in parent workflow")
          code = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(textwrap.dedent(code), {"__name__": "__main__"})
          PY

      - name: Format and validate patch
        run: |
          npm install --no-audit --no-fund
          npx prettier --write \
            src/components/storefront/liquid-mobile-menu.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            src/components/storefront/store-header.tsx \
            src/components/storefront/product-card.tsx \
            src/components/storefront/electronics-storefront.tsx \
            src/routes/index.tsx \
            src/mobile-vitrine-overrides.css \
            scripts/validate-mobile-vitrines.mjs \
            scripts/validate-novacore.mjs
          npx eslint \
            src/components/storefront/liquid-mobile-menu.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            src/components/storefront/store-header.tsx \
            src/components/storefront/product-card.tsx \
            src/components/storefront/electronics-storefront.tsx \
            src/routes/index.tsx
          npm run build

      - name: Commit patch
        run: |
          git rm .github/workflows/apply-final-production-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final mobile production defects"
          git push origin HEAD:fix/final-production-defects
