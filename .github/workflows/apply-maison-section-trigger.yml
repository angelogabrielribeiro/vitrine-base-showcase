name: Apply Maison section trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-maison-section-trigger.py"
      - ".github/workflows/apply-maison-section-trigger.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: python scripts/apply-maison-section-trigger.py

      - name: Format and validate
        run: |
          npx prettier --write src/components/storefront/fashion-storefront.tsx
          npx eslint src/components/storefront/fashion-storefront.tsx
          npm run build

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/fashion-storefront.tsx
          git commit -m "Usa gatilho único nos capítulos Maison [maison section trigger]"
          git push origin HEAD:fix/maison-scroll-layout-stage
