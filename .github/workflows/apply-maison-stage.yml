name: Apply Maison stage patch

on:
  push:
    branches:
      - fix/maison-scroll-layout-stage
    paths:
      - "scripts/apply-maison-stage.py"
      - ".github/workflows/apply-maison-stage.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[maison patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply focused patch
        run: python scripts/apply-maison-stage.py

      - name: Format and validate
        run: |
          npx prettier --write \
            src/components/storefront/fashion-storefront.tsx \
            src/components/storefront/product-card-editorial.tsx \
            src/components/storefront/store-cursor-shader.tsx \
            src/mobile-vitrine-overrides.css
          npx eslint \
            src/components/storefront/fashion-storefront.tsx \
            src/components/storefront/product-card-editorial.tsx \
            src/components/storefront/store-cursor-shader.tsx
          npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/fashion-storefront.tsx \
            src/components/storefront/product-card-editorial.tsx \
            src/components/storefront/store-cursor-shader.tsx \
            src/mobile-vitrine-overrides.css
          git commit -m "Corrige scroll e composição da Maison Belle [maison patch]"
          git push origin HEAD:fix/maison-scroll-layout-stage
