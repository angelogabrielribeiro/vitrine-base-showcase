# trigger after workflow registration
name: Finalize mobile vitrines

on:
  push:
    branches:
      - fix/mobile-vitrine-polish
    paths:
      - ".github/workflows/finalize-mobile-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-vitrine-polish
          fetch-depth: 0

      - name: Apply final mobile and validation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected fragment not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "src/routes/__root.tsx",
              '<html lang="pt-BR">',
              '<html lang="pt-BR" suppressHydrationWarning>',
          )
          replace(
              "src/routes/__root.tsx",
              "      <body>",
              "      <body suppressHydrationWarning>",
          )

          menu = Path("src/components/storefront/liquid-mobile-menu.tsx")
          text = menu.read_text(encoding="utf-8")
          text = text.replace(
              'import { useEffect, useId, useRef, useState } from "react";',
              'import { useCallback, useEffect, useId, useRef, useState } from "react";',
              1,
          )
          anchor = "  const { setMenuOpen } = useMobileMenuState();\n"
          if anchor not in text:
              raise SystemExit("Mobile menu state anchor not found")
          text = text.replace(
              anchor,
              anchor
              + "  const updateOpen = useCallback(\n"
              + "    (next: boolean) => {\n"
              + "      setOpen(next);\n"
              + "      setMenuOpen(next);\n"
              + "    },\n"
              + "    [setMenuOpen],\n"
              + "  );\n",
              1,
          )
          sync_effect = '''  // Sincroniza estado global (o FAB do WhatsApp desaparece com o menu aberto).
          useEffect(() => {
            setMenuOpen(open);
          }, [open, setMenuOpen]);
'''
          if sync_effect not in text:
              raise SystemExit("Mobile menu sync effect not found")
          text = text.replace(sync_effect, "", 1)
          text = text.replace("setOpen(false)", "updateOpen(false)")
          text = text.replace("setOpen(true)", "updateOpen(true)")
          text = text.replace("  }, [pathname]);", "  }, [pathname, updateOpen]);", 1)
          text = text.replace("  }, [open]);\n\n  useEffect(() => {\n    if (open) firstItemRef.current?.focus();", "  }, [open, updateOpen]);\n\n  useEffect(() => {\n    if (open) firstItemRef.current?.focus();", 1)
          menu.write_text(text, encoding="utf-8")

          replace(
              "src/components/storefront/whatsapp-fab.tsx",
              '"fixed right-5 z-30 inline-flex items-center justify-center rounded-full bg-green-500 text-white shadow-xl transition duration-300 hover:scale-105 hover:bg-green-600 md:z-40 " +',
              '"fixed right-5 z-30 inline-flex items-center justify-center rounded-full bg-green-500 text-white shadow-xl transition duration-200 hover:scale-105 hover:bg-green-600 md:z-40 " +',
          )
          replace(
              "src/components/storefront/whatsapp-fab.tsx",
              '? "pointer-events-none scale-90 opacity-0 md:pointer-events-auto md:scale-100 md:opacity-100 "',
              '? "invisible pointer-events-none scale-90 opacity-0 md:visible md:pointer-events-auto md:scale-100 md:opacity-100 "',
          )

          css = Path("src/mobile-vitrine-overrides.css")
          css_text = css.read_text(encoding="utf-8")
          ambient = '''

@media (max-width: 767px) and (prefers-reduced-motion: no-preference) {
  @keyframes mobile-vitrine-ambient-wine {
    0%, 100% { box-shadow: inset 0 0 0 rgba(212, 154, 167, 0); }
    50% { box-shadow: inset 0 0 42px rgba(212, 154, 167, 0.075); }
  }

  @keyframes mobile-vitrine-ambient-gold {
    0%, 100% { box-shadow: inset 0 0 0 rgba(244, 200, 102, 0); }
    50% { box-shadow: inset 0 0 44px rgba(244, 200, 102, 0.07); }
  }

  @keyframes mobile-vitrine-card-breathe {
    0%, 100% { transform: translate3d(0, 0, 0); filter: brightness(1); }
    50% { transform: translate3d(0, -3px, 0); filter: brightness(1.055); }
  }

  .store-theme-moda main section {
    animation: mobile-vitrine-ambient-wine 5.8s ease-in-out infinite;
  }

  .store-theme-barbearia main section {
    animation: mobile-vitrine-ambient-gold 5.6s ease-in-out infinite;
  }

  .store-theme-moda main article,
  .store-theme-barbearia main article {
    animation: mobile-vitrine-card-breathe 4.8s ease-in-out infinite;
    will-change: transform, filter;
  }

  .store-theme-moda main article:nth-of-type(2n),
  .store-theme-barbearia main article:nth-of-type(2n) {
    animation-delay: -1.6s;
  }
}
'''
          if "mobile-vitrine-ambient-wine" not in css_text:
              css.write_text(css_text.rstrip() + ambient + "\n", encoding="utf-8")

          replace(
              "src/components/storefront/catalog-expansion-hero.tsx",
              'className="relative overflow-hidden border-b border-white/12 px-5 pb-14 pt-7 text-white"',
              'className="relative overflow-hidden border-b border-white/12 px-5 pb-10 pt-5 text-white"',
          )
          replace(
              "src/components/storefront/catalog-expansion-hero.tsx",
              '<div className="mt-8">',
              '<div className="mt-6">',
          )
          replace(
              "src/components/storefront/catalog-expansion-hero.tsx",
              'className="relative mt-9 aspect-[4/5] overflow-hidden border border-white/18 bg-black/24 shadow-[0_32px_90px_rgba(0,0,0,.45)] [perspective:1000px]"',
              'className="relative mt-6 h-[min(34svh,17rem)] overflow-hidden border border-white/18 bg-black/24 shadow-[0_28px_76px_rgba(0,0,0,.42)] [perspective:1000px]"',
          )
          replace(
              "src/components/storefront/catalog-expansion-hero.tsx",
              '<div className="mt-4">\n                <FeatureContext store={store} lead={lead} />',
              '<div className="mt-3">\n                <FeatureContext store={store} lead={lead} />',
          )
          replace(
              "src/components/storefront/catalog-expansion-hero.tsx",
              '<div className="mt-6 flex snap-x gap-2 overflow-x-auto pb-1">',
              '<div className="mt-4 flex snap-x gap-2 overflow-x-auto pb-1">',
          )

          nova = Path("scripts/validate-novacore.mjs")
          nova_text = nova.read_text(encoding="utf-8")
          helper_anchor = '''async function assertNoOverflow(page, label) {
'''
          helper = '''async function screenshotVisibleRegion(page, locator, filePath) {
            const box = await locator.boundingBox();
            const viewport = page.viewportSize();
            assert(box && viewport, `Não foi possível medir a região para ${filePath}`);
            const x = Math.max(0, box.x);
            const y = Math.max(0, box.y);
            const width = Math.max(1, Math.min(box.width, viewport.width - x));
            const height = Math.max(1, Math.min(box.height, viewport.height - y));
            await page.screenshot({
              path: filePath,
              clip: { x, y, width, height },
              animations: "disabled",
              caret: "hide",
            });
          }

          '''
          if "async function screenshotVisibleRegion" not in nova_text:
              if helper_anchor not in nova_text:
                  raise SystemExit("NovaCore helper anchor not found")
              nova_text = nova_text.replace(helper_anchor, helper + helper_anchor, 1)
          nova_text = nova_text.replace(
              'await hero.screenshot({ path: path.join(output, "desktop-01-hero.png") });',
              'await screenshotVisibleRegion(page, hero, path.join(output, "desktop-01-hero.png"));',
              1,
          )
          nova_text = nova_text.replace(
              'await hero.screenshot({ path: path.join(output, "desktop-02-hero-reactive.png") });',
              'await screenshotVisibleRegion(page, hero, path.join(output, "desktop-02-hero-reactive.png"));',
              1,
          )
          nova.write_text(nova_text, encoding="utf-8")

          replace(
              "scripts/validate-mobile-vitrines.mjs",
              '''    "--use-angle=swiftshader-webgl",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-dev-shm-usage",''',
              '''    "--use-gl=angle",
              "--use-angle=swiftshader",
              "--enable-unsafe-swiftshader",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-gpu-sandbox",
              "--disable-dev-shm-usage",''',
          )
          PY

      - name: Format changed files
        run: |
          npm install --no-audit --no-fund
          npx prettier --write \
            src/routes/__root.tsx \
            src/components/storefront/liquid-mobile-menu.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            src/mobile-vitrine-overrides.css \
            src/components/storefront/catalog-expansion-hero.tsx \
            scripts/validate-novacore.mjs \
            scripts/validate-mobile-vitrines.mjs

      - name: Commit final fixes
        run: |
          git rm .github/workflows/finalize-mobile-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize mobile interactions and validation"
          git push origin HEAD:fix/mobile-vitrine-polish
