name: Format Barber stage

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/mobile-vitrine-overrides.css"
      - "src/components/storefront/product-card.tsx"
      - "scripts/validate-barber-mobile-cards.mjs"
      - ".github/workflows/format-barber-stage.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install formatter
        run: npm install --no-audit --no-fund

      - name: Format scoped files
        run: |
          npx prettier --write \
            src/mobile-vitrine-overrides.css \
            src/components/storefront/product-card.tsx \
            scripts/validate-barber-mobile-cards.mjs
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/format-barber-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mobile-vitrine-overrides.css \
            src/components/storefront/product-card.tsx \
            scripts/validate-barber-mobile-cards.mjs
          git commit -m "Format Barber mobile stage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
