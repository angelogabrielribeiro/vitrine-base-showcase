name: Format Maison validation

on:
  push:
    branches:
      - fix/maison-scroll-layout-stage
    paths:
      - ".github/workflows/format-maison-validation.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx prettier --write scripts/validate-maison-scroll-layout.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-maison-scroll-layout.mjs
          git commit -m "Formata regressão visual da Maison"
          git push origin HEAD:fix/maison-scroll-layout-stage

# trigger: format Maison validation
