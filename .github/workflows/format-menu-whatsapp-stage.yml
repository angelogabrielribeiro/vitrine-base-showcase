name: Format menu WhatsApp stage

on:
  push:
    branches:
      - fix/menu-whatsapp-mobile-stage
    paths:
      - ".github/workflows/format-menu-whatsapp-stage.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-whatsapp-mobile-stage
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format test and commit
        run: |
          npx prettier --write scripts/validate-menu-whatsapp-mobile.mjs
          git rm .github/workflows/format-menu-whatsapp-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format focused mobile menu regression test"
          git push origin HEAD:fix/menu-whatsapp-mobile-stage
