name: Format validation script

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Format script
        run: |
          npx prettier scripts/validate-ui.mjs > formatted-validate-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-validate-ui
          path: formatted-validate-ui.mjs
          retention-days: 1
