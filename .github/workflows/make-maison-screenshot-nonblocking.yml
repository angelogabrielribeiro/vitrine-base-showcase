name: Make Maison screenshot nonblocking

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/make-maison-screenshot-nonblocking.py"
      - ".github/workflows/make-maison-screenshot-nonblocking.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0
      - run: python scripts/make-maison-screenshot-nonblocking.py
      - name: Commit screenshot adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-maison-scroll-layout.mjs
          git commit -m "Torna captura Maison não bloqueante"
          git push origin HEAD:fix/maison-scroll-layout-stage
