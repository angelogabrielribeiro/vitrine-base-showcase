name: Patch Barber center activation

on:
  push:
    branches:
      - fix/barber-mobile-cards-stage
    paths:
      - ".github/workflows/patch-barber-center-activation.yml"

permissions:
  contents: write

concurrency:
  group: patch-barber-center-activation
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/barber-mobile-cards-stage
          fetch-depth: 0

      - name: Apply deterministic center activation
        run: |
          python - <<'PY'
          from pathlib import Path

          storefront_path = Path("src/components/storefront/barber-storefront.tsx")
          storefront = storefront_path.read_text(encoding="utf-8")

          anchor = "  const active = items[activeIdx];\n"
          if anchor not in storefront:
            raise SystemExit("ServicesEditorial active line not found")

          controller = '''  const active = items[activeIdx];
  const sectionRef = useRef<HTMLElement>(null);

  useEffect(() => {
    if (!isMobile) return;

    let frame = 0;
    const updateActiveService = () => {
      window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(() => {
        const rows = sectionRef.current?.querySelectorAll<HTMLElement>(
          "[data-service-index]",
        );
        if (!rows?.length) return;

        const viewportCenter = window.innerHeight / 2;
        let nearestIndex = 0;
        let nearestDistance = Number.POSITIVE_INFINITY;

        rows.forEach((row) => {
          const rect = row.getBoundingClientRect();
          const distance = Math.abs(rect.top + rect.height / 2 - viewportCenter);
          if (distance >= nearestDistance) return;
          nearestDistance = distance;
          nearestIndex = Number(row.dataset.serviceIndex ?? 0);
        });

        setActiveIdx(nearestIndex);
      });
    };

    updateActiveService();
    window.addEventListener("scroll", updateActiveService, { passive: true });
    window.addEventListener("resize", updateActiveService);
    return () => {
      window.cancelAnimationFrame(frame);
      window.removeEventListener("scroll", updateActiveService);
      window.removeEventListener("resize", updateActiveService);
    };
  }, [isMobile]);
'''
          storefront = storefront.replace(anchor, controller, 1)

          section = '<section className="mx-auto max-w-7xl px-6 py-20 sm:py-16">'
          if section not in storefront:
            raise SystemExit("ServicesEditorial section not found")
          storefront = storefront.replace(
            section,
            '<section ref={sectionRef} className="mx-auto max-w-7xl px-6 py-20 sm:py-16">',
            1,
          )

          observer = '  const { ref, inView } = useInView<HTMLLIElement>({ amount: 0.6 });\n'
          if observer not in storefront:
            raise SystemExit("ServiceRow observer line not found")
          storefront = storefront.replace(observer, "", 1)

          old_active = '''  // Mobile: acende sozinho ao entrar na viewport, em sequência com o scroll.
  // Desktop: reage a hover/foco, sem cursor simulado.
  const active = autoActivate ? inView : hovered;

  useEffect(() => {
    if (autoActivate && inView) onActivate?.();
  }, [autoActivate, inView, onActivate]);
'''
          new_active = '''  // Mobile: a linha mais próxima do centro da viewport acende automaticamente.
  // Desktop: reage a hover/foco, sem cursor simulado.
  const active = autoActivate ? Boolean(isActive) : hovered;
'''
          if old_active not in storefront:
            raise SystemExit("ServiceRow activation block not found")
          storefront = storefront.replace(old_active, new_active, 1)

          old_li = '''    <li
      ref={ref}'''
          new_li = '''    <li
      data-service-index={index}'''
          if old_li not in storefront:
            raise SystemExit("ServiceRow list element not found")
          storefront = storefront.replace(old_li, new_li, 1)
          storefront_path.write_text(storefront, encoding="utf-8")

          test_path = Path("scripts/validate-barber-mobile-cards.mjs")
          test = test_path.read_text(encoding="utf-8")
          visible_assert = '''      assert(serviceState.visibleRatio >= 0.6, `${label}: serviço não foi centralizado pelo teste`);
'''
          if visible_assert not in test:
            raise SystemExit("Service visibility assertion not found")
          deterministic_assertions = '''      assert(serviceState.visibleRatio >= 0.6, `${label}: serviço não foi centralizado pelo teste`);
      const serviceSelection = await serviceRows.evaluateAll((rows) => {
        const viewportCenter = innerHeight / 2;
        const states = rows.map((row, index) => {
          const rect = row.getBoundingClientRect();
          return {
            index,
            active: row.getAttribute("data-active") === "true",
            distance: Math.abs(rect.top + rect.height / 2 - viewportCenter),
          };
        });
        return {
          activeIndexes: states.filter((state) => state.active).map((state) => state.index),
          nearestIndex: states.reduce((nearest, state) =>
            state.distance < nearest.distance ? state : nearest,
          ).index,
        };
      });
      assert(serviceState.active === "true", `${label}: serviço central não recebeu data-active=true`);
      assert(
        serviceSelection.activeIndexes.length === 1,
        `${label}: mais de um serviço ficou ativo (${serviceSelection.activeIndexes.join(", ")})`,
      );
      assert(
        serviceSelection.activeIndexes[0] === serviceSelection.nearestIndex,
        `${label}: serviço ativo não é o mais próximo do centro`,
      );
'''
          test = test.replace(visible_assert, deterministic_assertions, 1)

          scenario_anchor = '''        serviceState,
        ritualState,
'''
          if scenario_anchor not in test:
            raise SystemExit("Scenario service state anchor not found")
          test = test.replace(
            scenario_anchor,
            '''        serviceState,
        serviceSelection,
        ritualState,
''',
            1,
          )
          test_path.write_text(test, encoding="utf-8")

          workflow_path = Path(".github/workflows/validate-barber-mobile-cards.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
            '      - "src/components/storefront/product-card.tsx"\n',
            '      - "src/components/storefront/product-card.tsx"\n      - "src/components/storefront/barber-storefront.tsx"\n',
            1,
          )
          workflow = workflow.replace(
            '            src/components/storefront/product-card.tsx \\\n            scripts/validate-barber-mobile-cards.mjs\n',
            '            src/components/storefront/product-card.tsx \\\n            src/components/storefront/barber-storefront.tsx \\\n            scripts/validate-barber-mobile-cards.mjs\n',
            1,
          )
          workflow = workflow.replace(
            '          npx eslint src/components/storefront/product-card.tsx\n',
            '          npx eslint \\\n            src/components/storefront/product-card.tsx \\\n            src/components/storefront/barber-storefront.tsx\n',
            1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Format, lint and build
        run: |
          npx prettier --write \
            src/components/storefront/barber-storefront.tsx \
            src/components/storefront/product-card.tsx \
            src/mobile-vitrine-overrides.css \
            scripts/validate-barber-mobile-cards.mjs \
            .github/workflows/validate-barber-mobile-cards.yml
          npx eslint \
            src/components/storefront/barber-storefront.tsx \
            src/components/storefront/product-card.tsx
          node --check scripts/validate-barber-mobile-cards.mjs
          npm run build

      - name: Start preview server
        run: |
          mkdir -p artifacts/barber-mobile-cards
          npm run dev -- --host 0.0.0.0 --port 4173 > artifacts/barber-mobile-cards/server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/barber-mobile-cards/server.log
          exit 1

      - name: Validate three mobile viewports
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-barber-mobile-cards.mjs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barber-center-activation-${{ github.run_id }}
          path: artifacts/barber-mobile-cards
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated patch and remove runner
        run: |
          rm .github/workflows/patch-barber-center-activation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/barber-storefront.tsx \
            src/components/storefront/product-card.tsx \
            src/mobile-vitrine-overrides.css \
            scripts/validate-barber-mobile-cards.mjs \
            .github/workflows/validate-barber-mobile-cards.yml \
            .github/workflows/patch-barber-center-activation.yml
          git commit -m "Make Barber service activation follow viewport center"
          git push origin HEAD:fix/barber-mobile-cards-stage
