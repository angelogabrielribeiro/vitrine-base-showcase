name: Patch Barber service activation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-barber-service-activation.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch deterministic mobile service activation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/storefront/barber-storefront.tsx")
          text = path.read_text(encoding="utf-8")

          old_start = '''  const isTouch = capabilities.coarsePointer;
          const [activeService, setActiveService] = useState(0);

          return (
            <section className="bg-[#0f0f12] px-5 py-24 sm:px-8 lg:px-12 lg:py-36">'''
          new_start = '''  const isTouch = capabilities.coarsePointer;
          const [activeService, setActiveService] = useState(0);
          const sectionRef = useRef<HTMLElement>(null);

          useEffect(() => {
            if (!isTouch) return;

            let frame = 0;
            const updateActiveService = () => {
              window.cancelAnimationFrame(frame);
              frame = window.requestAnimationFrame(() => {
                const cards = sectionRef.current?.querySelectorAll<HTMLElement>(
                  "[data-service-index]",
                );
                if (!cards?.length) return;

                const viewportCenter = window.innerHeight / 2;
                let nearestIndex = 0;
                let nearestDistance = Number.POSITIVE_INFINITY;

                cards.forEach((card) => {
                  const rect = card.getBoundingClientRect();
                  const cardCenter = rect.top + rect.height / 2;
                  const distance = Math.abs(cardCenter - viewportCenter);
                  if (distance >= nearestDistance) return;
                  nearestDistance = distance;
                  nearestIndex = Number(card.dataset.serviceIndex ?? 0);
                });

                setActiveService(nearestIndex);
              });
            };

            updateActiveService();
            window.addEventListener("scroll", updateActiveService, { passive: true });
            window.addEventListener("resize", updateActiveService);
            return () => {
              window.cancelAnimationFrame(frame);
              window.removeEventListener("scroll", updateActiveService);
              window.removeEventListener("resize", updateActiveService);
            };
          }, [isTouch]);

          return (
            <section
              ref={sectionRef}
              className="bg-[#0f0f12] px-5 py-24 sm:px-8 lg:px-12 lg:py-36"
            >'''

          if old_start not in text:
            raise SystemExit("ServiceMenuSection start block not found")
          text = text.replace(old_start, new_start, 1)

          old_call = '''                    active={activeService === index}
                    onActivate={() => setActiveService(index)}
                    isTouch={isTouch}'''
          new_call = '''                    active={activeService === index}
                    isTouch={isTouch}'''
          if old_call not in text:
            raise SystemExit("ServiceCard call block not found")
          text = text.replace(old_call, new_call, 1)

          old_signature = '''  active,
          onActivate,
          isTouch,
        }: {
          service: BarberService;
          index: number;
          store: StoreConfig;
          active: boolean;
          onActivate: () => void;
          isTouch: boolean;
        }) {
          const ref = useRef<HTMLLIElement>(null);
          const inView = useInView(ref, { amount: 0.6 });

          useEffect(() => {
            if (inView) onActivate();
          }, [inView, onActivate]);

          return (
            <motion.li
              ref={ref}'''
          new_signature = '''  active,
          isTouch,
        }: {
          service: BarberService;
          index: number;
          store: StoreConfig;
          active: boolean;
          isTouch: boolean;
        }) {
          return (
            <motion.li
              data-service-index={index}'''
          if old_signature not in text:
            raise SystemExit("ServiceCard observer block not found")
          text = text.replace(old_signature, new_signature, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/components/storefront/barber-storefront.tsx
          npx eslint src/components/storefront/barber-storefront.tsx
          npm run build

      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/patch-barber-service-activation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/barber-storefront.tsx
          git commit -m "Make Barber service activation follow viewport center"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
