name: Patch Barber service activation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-barber-service-activation.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch deterministic mobile service activation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/storefront/barber-storefront.tsx")
          text = path.read_text(encoding="utf-8")

          old_state = '''  const active = items[activeIdx];
          return (
            <section className="mx-auto max-w-7xl px-6 py-20 sm:py-16">'''
          new_state = '''  const active = items[activeIdx];
          const sectionRef = useRef<HTMLElement>(null);

          useEffect(() => {
            if (!isMobile) return;

            let frame = 0;
            const updateActiveService = () => {
              window.cancelAnimationFrame(frame);
              frame = window.requestAnimationFrame(() => {
                const rows = sectionRef.current?.querySelectorAll<HTMLElement>(
                  "[data-service-index]",
                );
                if (!rows?.length) return;

                const viewportCenter = window.innerHeight / 2;
                let nearestIndex = 0;
                let nearestDistance = Number.POSITIVE_INFINITY;

                rows.forEach((row) => {
                  const rect = row.getBoundingClientRect();
                  const distance = Math.abs(rect.top + rect.height / 2 - viewportCenter);
                  if (distance >= nearestDistance) return;
                  nearestDistance = distance;
                  nearestIndex = Number(row.dataset.serviceIndex ?? 0);
                });

                setActiveIdx(nearestIndex);
              });
            };

            updateActiveService();
            window.addEventListener("scroll", updateActiveService, { passive: true });
            window.addEventListener("resize", updateActiveService);
            return () => {
              window.cancelAnimationFrame(frame);
              window.removeEventListener("scroll", updateActiveService);
              window.removeEventListener("resize", updateActiveService);
            };
          }, [isMobile]);

          return (
            <section ref={sectionRef} className="mx-auto max-w-7xl px-6 py-20 sm:py-16">'''
          if old_state not in text:
            raise SystemExit("ServicesEditorial state block not found")
          text = text.replace(old_state, new_state, 1)

          old_observer = '''  const reduce = useReducedMotion();
          const [hovered, setHovered] = useState(false);
          const { ref, inView } = useInView<HTMLLIElement>({ amount: 0.6 });
          const image = service.image;

          // Mobile: acende sozinho ao entrar na viewport, em sequência com o scroll.
          // Desktop: reage a hover/foco, sem cursor simulado.
          const active = autoActivate ? inView : hovered;

          useEffect(() => {
            if (autoActivate && inView) onActivate?.();
          }, [autoActivate, inView, onActivate]);

          return (
            <li
              ref={ref}'''
          new_observer = '''  const reduce = useReducedMotion();
          const [hovered, setHovered] = useState(false);
          const image = service.image;

          // Mobile: a linha mais próxima do centro da viewport acende automaticamente.
          // Desktop: reage a hover/foco, sem cursor simulado.
          const active = autoActivate ? Boolean(isActive) : hovered;

          return (
            <li
              data-service-index={index}'''
          if old_observer not in text:
            raise SystemExit("ServiceRow observer block not found")
          text = text.replace(old_observer, new_observer, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/components/storefront/barber-storefront.tsx
          npx eslint src/components/storefront/barber-storefront.tsx
          npm run build

      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/patch-barber-service-activation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/barber-storefront.tsx
          git commit -m "Make Barber service activation follow viewport center"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
