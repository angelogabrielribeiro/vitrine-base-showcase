name: Patch Barber service center

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/barber-service-center.trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/barber-mobile-cards-stage
          fetch-depth: 0

      - name: Patch service activation and focused assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/storefront/barber-storefront.tsx")
          source = path.read_text(encoding="utf-8")

          anchor = "  const active = items[activeIdx];\n"
          if anchor not in source:
              raise SystemExit("ServicesEditorial anchor missing")
          source = source.replace(anchor, '''  const active = items[activeIdx];
  const sectionRef = useRef<HTMLElement>(null);

  useEffect(() => {
    if (!isMobile) return;

    let frame = 0;
    const updateActiveService = () => {
      window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(() => {
        const rows = sectionRef.current?.querySelectorAll<HTMLElement>(
          "[data-service-index]",
        );
        if (!rows?.length) return;

        const viewportCenter = window.innerHeight / 2;
        let nearestIndex = 0;
        let nearestDistance = Number.POSITIVE_INFINITY;

        rows.forEach((row) => {
          const rect = row.getBoundingClientRect();
          const distance = Math.abs(rect.top + rect.height / 2 - viewportCenter);
          if (distance >= nearestDistance) return;
          nearestDistance = distance;
          nearestIndex = Number(row.dataset.serviceIndex ?? 0);
        });

        setActiveIdx(nearestIndex);
      });
    };

    updateActiveService();
    window.addEventListener("scroll", updateActiveService, { passive: true });
    window.addEventListener("resize", updateActiveService);
    return () => {
      window.cancelAnimationFrame(frame);
      window.removeEventListener("scroll", updateActiveService);
      window.removeEventListener("resize", updateActiveService);
    };
  }, [isMobile]);
''', 1)

          section = '<section className="mx-auto max-w-7xl px-6 py-20 sm:py-16">'
          if section not in source:
              raise SystemExit("ServicesEditorial section missing")
          source = source.replace(
              section,
              '<section ref={sectionRef} className="mx-auto max-w-7xl px-6 py-20 sm:py-16">',
              1,
          )

          observer = '  const { ref, inView } = useInView<HTMLLIElement>({ amount: 0.6 });\n'
          if observer not in source:
              raise SystemExit("ServiceRow observer missing")
          source = source.replace(observer, "", 1)

          old = '''  // Mobile: acende sozinho ao entrar na viewport, em sequência com o scroll.
  // Desktop: reage a hover/foco, sem cursor simulado.
  const active = autoActivate ? inView : hovered;

  useEffect(() => {
    if (autoActivate && inView) onActivate?.();
  }, [autoActivate, inView, onActivate]);
'''
          new = '''  // Mobile: a linha mais próxima do centro da viewport acende automaticamente.
  // Desktop: reage a hover/foco, sem cursor simulado.
  const active = autoActivate ? Boolean(isActive) : hovered;
'''
          if old not in source:
              raise SystemExit("ServiceRow activation block missing")
          source = source.replace(old, new, 1)

          old_li = '''    <li
      ref={ref}'''
          if old_li not in source:
              raise SystemExit("ServiceRow li missing")
          source = source.replace(old_li, '''    <li
      data-service-index={index}''', 1)
          path.write_text(source, encoding="utf-8")

          test_path = Path("scripts/validate-barber-mobile-cards.mjs")
          test = test_path.read_text(encoding="utf-8")
          marker = '''      assert(serviceState.visibleRatio >= 0.6, `${label}: serviço não foi centralizado pelo teste`);
'''
          if marker not in test:
              raise SystemExit("Service assertion marker missing")
          test = test.replace(marker, marker + '''      const serviceSelection = await serviceRows.evaluateAll((rows) => {
        const viewportCenter = innerHeight / 2;
        const states = rows.map((row, index) => {
          const rect = row.getBoundingClientRect();
          return {
            index,
            active: row.getAttribute("data-active") === "true",
            distance: Math.abs(rect.top + rect.height / 2 - viewportCenter),
          };
        });
        return {
          activeIndexes: states.filter((state) => state.active).map((state) => state.index),
          nearestIndex: states.reduce((nearest, state) =>
            state.distance < nearest.distance ? state : nearest,
          ).index,
        };
      });
      assert(serviceState.active === "true", `${label}: serviço central não recebeu data-active=true`);
      assert(
        serviceSelection.activeIndexes.length === 1,
        `${label}: mais de um serviço ficou ativo (${serviceSelection.activeIndexes.join(", ")})`,
      );
      assert(
        serviceSelection.activeIndexes[0] === serviceSelection.nearestIndex,
        `${label}: serviço ativo não é o mais próximo do centro`,
      );
''', 1)

          report_marker = '''        serviceState,
        ritualState,
'''
          if report_marker not in test:
              raise SystemExit("Service report marker missing")
          test = test.replace(report_marker, '''        serviceState,
        serviceSelection,
        ritualState,
''', 1)
          test_path.write_text(test, encoding="utf-8")

          workflow_path = Path(".github/workflows/validate-barber-mobile-cards.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          product = '      - "src/components/storefront/product-card.tsx"\n'
          if '      - "src/components/storefront/barber-storefront.tsx"\n' not in workflow:
              workflow = workflow.replace(product, product + '      - "src/components/storefront/barber-storefront.tsx"\n', 1)
          prettier = '''            src/components/storefront/product-card.tsx \\
            scripts/validate-barber-mobile-cards.mjs
'''
          if '            src/components/storefront/barber-storefront.tsx \\
' not in workflow:
              workflow = workflow.replace(prettier, '''            src/components/storefront/product-card.tsx \\
            src/components/storefront/barber-storefront.tsx \\
            scripts/validate-barber-mobile-cards.mjs
''', 1)
          eslint = '          npx eslint src/components/storefront/product-card.tsx\n'
          if eslint in workflow:
              workflow = workflow.replace(eslint, '''          npx eslint \\
            src/components/storefront/product-card.tsx \\
            src/components/storefront/barber-storefront.tsx
''', 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/barber-storefront.tsx \
            scripts/validate-barber-mobile-cards.mjs \
            .github/workflows/validate-barber-mobile-cards.yml
          git commit -m "Make Barber service activation follow viewport center"
          git push origin HEAD:fix/barber-mobile-cards-stage

      - name: Remove temporary runner from main
        if: always()
        run: |
          git fetch origin main
          git worktree add -B barber-main-cleanup /tmp/vitrine-main origin/main
          cd /tmp/vitrine-main
          git rm -f .github/workflows/patch-barber-service-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Barber service runner"
          git push origin HEAD:main

      - name: Remove branch trigger
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git fetch origin fix/barber-mobile-cards-stage
          git reset --hard origin/fix/barber-mobile-cards-stage
          git rm -f .github/barber-service-center.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Barber service trigger"
          git push origin HEAD:fix/barber-mobile-cards-stage
