name: Patch Barber service center

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/barber-service-center.trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/barber-mobile-cards-stage
          fetch-depth: 0

      - name: Apply service-center patch
        run: python .github/scripts/patch-barber-service-center.py

      - name: Format patched files
        run: |
          npm install --no-audit --no-fund
          npx prettier --write \
            src/components/storefront/barber-storefront.tsx \
            scripts/validate-barber-mobile-cards.mjs \
            .github/workflows/validate-barber-mobile-cards.yml
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Commit patch and remove branch helpers
        run: |
          git rm \
            .github/scripts/patch-barber-service-center.py \
            .github/barber-service-center.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/barber-storefront.tsx \
            scripts/validate-barber-mobile-cards.mjs \
            .github/workflows/validate-barber-mobile-cards.yml
          git commit -m "Make Barber service activation follow viewport center"
          git push origin HEAD:fix/barber-mobile-cards-stage

      - name: Remove temporary workflow from main
        if: always()
        run: |
          git fetch origin main
          git worktree add -B barber-main-cleanup /tmp/vitrine-main origin/main
          cd /tmp/vitrine-main
          git rm -f .github/workflows/patch-barber-service-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Barber service workflow"
          git push origin HEAD:main

      - name: Remove branch helpers after failure
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git fetch origin fix/barber-mobile-cards-stage
          git reset --hard origin/fix/barber-mobile-cards-stage
          git rm -f \
            .github/scripts/patch-barber-service-center.py \
            .github/barber-service-center.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove failed Barber service helpers"
          git push origin HEAD:fix/barber-mobile-cards-stage
