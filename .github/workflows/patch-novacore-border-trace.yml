name: Patch NovaCore border trace

on:
  push:
    branches:
      - fix/mobile-vitrine-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-vitrine-polish
          fetch-depth: 0

      - name: Insert missing component
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/storefront/electronics-storefront.tsx")
          text = path.read_text(encoding="utf-8")
          marker = "function CategoryCommandDeck({ store }: { store: StoreConfig }) {"
          component = '''function BorderTraceFrame({
            index = 0,
            intensity = 0.5,
          }: {
            index?: number;
            intensity?: number;
          }) {
            const reduceMotion = useReducedMotion();
            const opacity = Math.max(0.12, Math.min(0.55, intensity));

            return (
              <motion.span
                aria-hidden="true"
                className="pointer-events-none absolute inset-0 z-30 border border-cyan-200/60"
                style={{ opacity }}
                animate={
                  reduceMotion
                    ? undefined
                    : {
                        clipPath: [
                          "inset(0 100% 99% 0)",
                          "inset(0 0 99% 0)",
                          "inset(0 0 0 99%)",
                          "inset(99% 0 0 0)",
                          "inset(0 99% 0 0)",
                          "inset(0 100% 99% 0)",
                        ],
                      }
                }
                transition={{
                  duration: 5.8 + (index % 3) * 0.45,
                  delay: (index % 4) * 0.15,
                  repeat: reduceMotion ? 0 : Number.POSITIVE_INFINITY,
                  ease: "linear",
                }}
              />
            );
          }

          '''

          if "function BorderTraceFrame(" not in text:
            if marker not in text:
              raise SystemExit("CategoryCommandDeck marker not found")
            text = text.replace(marker, component + marker, 1)
            path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "BorderTraceFrame already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/electronics-storefront.tsx
          git commit -m "Fix NovaCore border trace runtime"
          git push origin HEAD:fix/mobile-vitrine-polish
