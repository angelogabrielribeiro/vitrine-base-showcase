name: Patch NovaCore validation

on:
  push:
    branches:
      - fix/mobile-vitrine-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-vitrine-polish
          fetch-depth: 0

      - name: Update validation expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-novacore.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
            'const browser = await chromium.launch({ headless: true });': '''const browser = await chromium.launch({
              headless: true,
              args: [
                "--use-angle=swiftshader-webgl",
                "--enable-webgl",
                "--ignore-gpu-blocklist",
                "--disable-dev-shm-usage",
              ],
            });''',
            'const desktopCanvases = await desktopPage.locator("canvas").count();': '''await desktopPage.locator("canvas").first().waitFor({ state: "visible", timeout: 30_000 });
            const desktopCanvases = await desktopPage.locator("canvas").count();''',
            'assert(desktopCanvases >= 2, `Esperados ao menos dois canvases interativos, encontrados ${desktopCanvases}`);': 'assert(desktopCanvases >= 1, `Esperado ao menos um canvas 3D adaptativo, encontrados ${desktopCanvases}`);',
            'const mobileCanvases = await mobilePage.locator("canvas").count();': '''await mobilePage.locator("canvas").first().waitFor({ state: "visible", timeout: 30_000 });
            const mobileCanvases = await mobilePage.locator("canvas").count();''',
            'assert(mobileCanvases === 0, `Mobile iniciou ${mobileCanvases} canvases WebGL`);': 'assert(mobileCanvases >= 1, `Mobile não iniciou o canvas WebGL adaptativo`);',
          }

          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected validation fragment not found: {old}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit validation update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-novacore.yml
          git commit -m "Validate adaptive WebGL on NovaCore mobile"
          git push origin HEAD:fix/mobile-vitrine-polish
