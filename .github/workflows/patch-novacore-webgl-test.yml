name: Patch NovaCore WebGL test

on:
  push:
    branches:
      - fix/mobile-vitrine-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-vitrine-polish
          fetch-depth: 0

      - name: Patch Chromium arguments
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-novacore.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    "--use-angle=swiftshader-webgl",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-dev-shm-usage",'''
          new = '''    "--use-gl=angle",
              "--use-angle=swiftshader",
              "--enable-unsafe-swiftshader",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-gpu-sandbox",
              "--disable-dev-shm-usage",'''
          if old not in text:
            raise SystemExit('Expected Chromium argument block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-novacore.mjs
          git commit -m "Enable SwiftShader for NovaCore WebGL tests"
          git push origin HEAD:fix/mobile-vitrine-polish
