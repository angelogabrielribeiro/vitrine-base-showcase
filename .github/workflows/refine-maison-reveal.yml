name: Refine Maison reveal

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/refine-maison-reveal.py"
      - ".github/workflows/refine-maison-reveal.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Make test replacement deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/refine-maison-reveal.py")
          content = path.read_text()
          start = content.index("test, count = re.subn(")
          end = content.index("test_path.write_text(test)", start)
          exact = '''block_start = test.index(
              '  if (scenario.mobile) {',
              test.index('const targetBox = await target.boundingBox();'),
          )
          block_end = test.index('\n\n  return metrics;', block_start)
          test = test[:block_start] + replacement + test[block_end:]

          '''
          path.write_text(content[:start] + exact + content[end:])
          PY
          python scripts/refine-maison-reveal.py

      - name: Format and validate
        run: |
          npx prettier --write \
            src/components/storefront/fashion-storefront.tsx \
            scripts/validate-maison-scroll-layout.mjs
          npx eslint src/components/storefront/fashion-storefront.tsx
          node --check scripts/validate-maison-scroll-layout.mjs
          npm run build

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/fashion-storefront.tsx \
            scripts/validate-maison-scroll-layout.mjs
          git commit -m "Acelera revelação editorial da Maison [maison reveal]"
          git push origin HEAD:fix/maison-scroll-layout-stage
