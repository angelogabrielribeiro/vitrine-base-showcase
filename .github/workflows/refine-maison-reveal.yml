name: Refine Maison reveal

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/refine-maison-reveal.py"
      - ".github/workflows/refine-maison-reveal.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: python scripts/refine-maison-reveal.py

      - name: Format and validate
        run: |
          npx prettier --write \
            src/components/storefront/fashion-storefront.tsx \
            scripts/validate-maison-scroll-layout.mjs
          npx eslint src/components/storefront/fashion-storefront.tsx
          node --check scripts/validate-maison-scroll-layout.mjs
          npm run build

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/fashion-storefront.tsx \
            scripts/validate-maison-scroll-layout.mjs
          git commit -m "Acelera revelação editorial da Maison [maison reveal]"
          git push origin HEAD:fix/maison-scroll-layout-stage
