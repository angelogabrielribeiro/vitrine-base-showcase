name: Sync Maison reveal validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/sync-maison-reveal-validation.py"
      - ".github/workflows/sync-maison-reveal-validation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: python scripts/sync-maison-reveal-validation.py
      - run: |
          npx prettier --write scripts/validate-maison-scroll-layout.mjs
          node --check scripts/validate-maison-scroll-layout.mjs

      - name: Commit validation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-maison-scroll-layout.mjs
          git commit -m "Sincroniza regressão visual da Maison [maison validation sync]"
          git push origin HEAD:fix/maison-scroll-layout-stage
