name: Update Maison general regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/update-maison-general-regression.py"
      - ".github/workflows/update-maison-general-regression.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maison-scroll-layout-stage
          fetch-depth: 0
      - run: python scripts/update-maison-general-regression.py
      - name: Commit general regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-ui.mjs
          git commit -m "Atualiza regressão geral para Maison compacta"
          git push origin HEAD:fix/maison-scroll-layout-stage
