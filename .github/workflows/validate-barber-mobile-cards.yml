# Final focused regression for automatic Barber Noir mobile interactions.
name: Validate Barber mobile cards

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/mobile-vitrine-overrides.css"
      - "src/components/storefront/product-card.tsx"
      - "src/components/storefront/hero/barber-hero.tsx"
      - "scripts/validate-barber-mobile-cards.mjs"
      - ".github/workflows/validate-barber-mobile-cards.yml"

permissions:
  contents: read

concurrency:
  group: barber-mobile-cards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Check and build
        run: |
          npx prettier --check \
            src/mobile-vitrine-overrides.css \
            src/components/storefront/product-card.tsx \
            src/components/storefront/hero/barber-hero.tsx \
            scripts/validate-barber-mobile-cards.mjs
          npx eslint \
            src/components/storefront/product-card.tsx \
            src/components/storefront/hero/barber-hero.tsx
          node --check scripts/validate-barber-mobile-cards.mjs
          npm run build

      - name: Start preview server
        run: |
          mkdir -p artifacts/barber-mobile-cards
          npm run dev -- --host 0.0.0.0 --port 4173 > artifacts/barber-mobile-cards/server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/barber-mobile-cards/server.log
          exit 1

      - name: Run focused Barber regression
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-barber-mobile-cards.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barber-mobile-cards-${{ github.run_id }}
          path: artifacts/barber-mobile-cards
          if-no-files-found: warn
          retention-days: 14
