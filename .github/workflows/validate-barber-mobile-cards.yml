name: Format final Barber validation script

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-barber-mobile-cards.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install formatter
        run: npm install --no-audit --no-fund

      - name: Format focused validation
        run: |
          npx prettier --write scripts/validate-barber-mobile-cards.mjs
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Restore validation workflow and commit
        run: |
          git checkout HEAD^ -- .github/workflows/validate-barber-mobile-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/validate-barber-mobile-cards.yml \
            scripts/validate-barber-mobile-cards.mjs
          git commit -m "Format Barber mobile validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
