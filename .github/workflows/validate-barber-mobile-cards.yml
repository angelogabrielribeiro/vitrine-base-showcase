name: Format Barber service controller

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-barber-mobile-cards.yml"

permissions:
  contents: write

concurrency:
  group: format-barber-service-controller
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/barber-mobile-cards-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/barber-mobile-cards-stage
          fetch-depth: 0

      - name: Install formatter
        run: npm install --no-audit --no-fund

      - name: Format edited source and regression
        run: |
          npx prettier --write \
            src/components/storefront/hero/barber-hero.tsx \
            scripts/validate-barber-mobile-cards.mjs
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/hero/barber-hero.tsx \
            scripts/validate-barber-mobile-cards.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Barber service controller"
          git push origin HEAD:fix/barber-mobile-cards-stage
