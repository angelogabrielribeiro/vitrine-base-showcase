name: Validate mobile menu and WhatsApp

on:
  push:
    branches:
      - fix/menu-whatsapp-mobile-stage
  pull_request:
    branches:
      - main
    paths:
      - "src/components/storefront/mobile-menu-state.tsx"
      - "src/components/storefront/liquid-mobile-menu.tsx"
      - "src/components/storefront/whatsapp-fab.tsx"
      - "scripts/validate-menu-whatsapp-mobile.mjs"
      - ".github/workflows/validate-menu-whatsapp-mobile.yml"

permissions:
  contents: read

concurrency:
  group: menu-whatsapp-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Check and build
        run: |
          npx prettier --check \
            src/components/storefront/mobile-menu-state.tsx \
            src/components/storefront/whatsapp-fab.tsx \
            scripts/validate-menu-whatsapp-mobile.mjs
          npx eslint \
            src/components/storefront/mobile-menu-state.tsx \
            src/components/storefront/whatsapp-fab.tsx
          node --check scripts/validate-menu-whatsapp-mobile.mjs
          npm run build

      - name: Start preview server
        run: |
          mkdir -p artifacts/menu-whatsapp-mobile
          npm run dev -- --host 0.0.0.0 --port 4173 > artifacts/menu-whatsapp-mobile/server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/menu-whatsapp-mobile/server.log
          exit 1

      - name: Run focused regression test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-menu-whatsapp-mobile.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-whatsapp-mobile-${{ github.run_id }}
          path: artifacts/menu-whatsapp-mobile
          if-no-files-found: warn
          retention-days: 14
