name: Validate mobile vitrines

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-vitrines-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-vitrines:
    name: Validate mobile interactions and layout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install matching Playwright library
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Validate script syntax
        run: node --check scripts/validate-mobile-vitrines.mjs

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vitrine-mobile-server.log 2>&1 &
          echo $! > /tmp/vitrine-mobile-server.pid

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vitrine-mobile-server.log
          exit 1

      - name: Run mobile and desktop validation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-mobile-vitrines.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-vitrines-${{ github.run_id }}
          path: |
            artifacts/mobile-vitrines
            /tmp/vitrine-mobile-server.log
          if-no-files-found: warn
          retention-days: 14
