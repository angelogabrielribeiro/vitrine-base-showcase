name: Validate NovaCore spatial experience

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/storefront/electronics-*.tsx"
      - "src/components/storefront/novacore-*.tsx"
      - "scripts/validate-novacore.mjs"
      - ".github/workflows/validate-novacore.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novacore-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Record desktop and mobile experience
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install matching Playwright library
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Validate script syntax
        run: node --check scripts/validate-novacore.mjs

      - name: Build application
        run: npm run build

      - name: Start application server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/novacore-server.log 2>&1 &
          echo $! > /tmp/novacore-server.pid

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/novacore-server.log
          exit 1

      - name: Record and validate NovaCore
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-novacore.mjs

      - name: Copy server log
        if: always()
        run: cp /tmp/novacore-server.log artifacts/novacore-validation/server.log || true

      - name: Upload NovaCore screenshots, recordings and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novacore-validation-${{ github.run_id }}
          path: artifacts/novacore-validation
          if-no-files-found: error
          retention-days: 14
