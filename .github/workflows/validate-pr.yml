name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  lint:
    name: Validate changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: |
          npx prettier --check \
            .github/workflows/validate-pr.yml \
            scripts/validate-ui.mjs \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/styles.css \
            src/components/marketing/premium-home-hero.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Lint changed interface files
        run: |
          npx eslint \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/premium-home-hero.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Validate browser script syntax
        run: node --check scripts/validate-ui.mjs

      - name: Report existing repository lint debt
        continue-on-error: true
        run: npm run lint

  ui:
    name: Validate animations and responsive states
    needs:
      - build
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install matching Playwright library
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Start application server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vitrine-server.log 2>&1 &
          echo $! > /tmp/vitrine-server.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vitrine-server.log
          exit 1

      - name: Run animation and responsive validation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-ui.mjs

      - name: Validate commercial routes, typography and keyboard access
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const baseUrl = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          await context.addInitScript(() => {
            const nativeMatchMedia = window.matchMedia.bind(window);
            window.matchMedia = (query) => {
              const result = nativeMatchMedia(query);
              const matches =
                query === "(hover: hover) and (pointer: fine)"
                  ? true
                  : query === "(pointer: coarse)"
                    ? false
                    : result.matches;
              return {
                matches,
                media: result.media,
                onchange: result.onchange,
                addListener: result.addListener.bind(result),
                removeListener: result.removeListener.bind(result),
                addEventListener: result.addEventListener.bind(result),
                removeEventListener: result.removeEventListener.bind(result),
                dispatchEvent: result.dispatchEvent.bind(result),
              };
            };
            Object.defineProperty(navigator, "hardwareConcurrency", {
              configurable: true,
              value: 8,
            });
            Object.defineProperty(navigator, "deviceMemory", {
              configurable: true,
              value: 8,
            });
          });
          const page = await context.newPage();

          try {
            const response = await page.goto(baseUrl, {
              waitUntil: "networkidle",
              timeout: 90_000,
            });

            if (!response?.ok()) {
              throw new Error(`Homepage respondeu com status ${response?.status()}`);
            }

            await page.keyboard.press("Tab");
            const focused = page.locator(":focus");
            const focusedText = (await focused.textContent())?.trim() ?? "";

            if (!/Ir para o conteúdo/i.test(focusedText) || !(await focused.isVisible())) {
              throw new Error("O link de pular para o conteúdo não recebeu foco visível");
            }

            const headingFont = await page.locator("#inicio h1").evaluate(
              (element) => getComputedStyle(element).fontFamily,
            );
            const bodyFont = await page.locator("body").evaluate(
              (element) => getComputedStyle(element).fontFamily,
            );

            if (!headingFont.includes("Syne")) {
              throw new Error(`A tipografia display não usa Syne: ${headingFont}`);
            }
            if (!bodyFont.includes("Manrope")) {
              throw new Error(`A tipografia de interface não usa Manrope: ${bodyFont}`);
            }

            const heroImages = await page.locator("#inicio img").evaluateAll((images) => ({
              total: images.length,
              loaded: images.filter((image) => image.complete && image.naturalWidth > 0).length,
            }));

            if (heroImages.total !== 4 || heroImages.loaded !== 4) {
              throw new Error(
                `Hero: esperado 4 imagens carregadas, encontrado ${heroImages.loaded}/${heroImages.total}`,
              );
            }

            const whatsappLinks = await page.locator('a[href^="https://wa.me/"]').count();
            if (whatsappLinks < 2) {
              throw new Error(`Foram encontrados apenas ${whatsappLinks} CTAs de WhatsApp`);
            }

            const collectRoutes = async (name, expectedCount, pattern) => {
              const links = page.getByRole("link", { name });
              const count = await links.count();

              if (count !== expectedCount) {
                throw new Error(`${String(name)}: esperado ${expectedCount}, encontrado ${count}`);
              }

              const hrefs = await links.evaluateAll((elements) =>
                elements.map((element) => element.getAttribute("href")),
              );

              for (const href of hrefs) {
                if (!href || !pattern.test(href)) {
                  throw new Error(`${String(name)} possui destino inválido: ${href}`);
                }
              }

              return hrefs;
            };

            const storeRoutes = await collectRoutes("Abrir loja", 4, /^\/demo\/[^/]+$/);
            const adminRoutes = await collectRoutes(
              "Explorar painel",
              4,
              /^\/demo\/[^/]+\/admin$/,
            );
            const bookingRoutes = await collectRoutes(
              "Testar agendamento",
              1,
              /^\/demo\/[^/]+\/agendar$/,
            );

            const planHrefs = await page
              .getByRole("link", { name: /Planos/i })
              .evaluateAll((elements) => elements.map((element) => element.getAttribute("href")));

            if (!planHrefs.includes("/planos")) {
              throw new Error(`Nenhum link de planos aponta para /planos: ${planHrefs.join(", ")}`);
            }

            const uniqueRoutes = [
              ...new Set([...storeRoutes, ...adminRoutes, ...bookingRoutes, "/planos"]),
            ];

            for (const route of uniqueRoutes) {
              const routeResponse = await page.goto(new URL(route, baseUrl).toString(), {
                waitUntil: "domcontentloaded",
                timeout: 90_000,
              });

              if (!routeResponse || routeResponse.status() >= 400) {
                throw new Error(`${route} respondeu com status ${routeResponse?.status()}`);
              }

              const bodyText = (await page.locator("body").innerText()).trim();
              if (bodyText.length < 20) {
                throw new Error(`${route} carregou sem conteúdo suficiente`);
              }
            }

            const demoSlugs = ["moda", "barbearia", "restaurante", "eletronicos"];

            for (const slug of demoSlugs) {
              await page.goto(new URL(`/demo/${slug}`, baseUrl).toString(), {
                waitUntil: "networkidle",
                timeout: 90_000,
              });

              if ((await page.getByTestId("store-cursor-shader").count()) !== 1) {
                throw new Error(`${slug}: shader interativo não foi renderizado`);
              }

              if (
                slug === "barbearia" &&
                (await page.getByTestId("odyssey-scene").count()) !== 3
              ) {
                throw new Error("barbearia: narrativa preservada não possui três atos");
              }
              if (
                slug === "restaurante" &&
                (await page.getByTestId("restaurant-fire-deck").count()) !== 1
              ) {
                throw new Error("Brasa Urbana não renderizou o deck interativo de fogo");
              }
              if (
                slug === "eletronicos" &&
                (await page.getByTestId("electronics-circuit-story").count()) !== 1
              ) {
                throw new Error("NovaCore não renderizou a narrativa própria de circuitos");
              }

              if (slug === "restaurante" || slug === "eletronicos") {
                const story =
                  slug === "restaurante"
                    ? page.getByTestId("restaurant-fire-deck")
                    : page.getByTestId("electronics-circuit-story");
                const storyMetrics = await story.evaluate((element) => ({
                  top: element.getBoundingClientRect().top + window.scrollY,
                  height: element.getBoundingClientRect().height,
                }));
                await page.evaluate(
                  ({ top, height }) =>
                    window.scrollTo(0, top + Math.max(0, height - window.innerHeight) * 0.48),
                  storyMetrics,
                );
                await page.waitForTimeout(900);
                await page.screenshot({
                  path: `artifacts/ui-validation/commerce-${slug}-story.png`,
                  fullPage: false,
                });
              }

              await page.goto(new URL(`/demo/${slug}/produtos`, baseUrl).toString(), {
                waitUntil: "networkidle",
                timeout: 90_000,
              });

              const catalogHero = page.getByTestId("catalog-expansion-hero");
              try {
                await catalogHero.waitFor({ state: "attached", timeout: 15_000 });
              } catch {
                await page.screenshot({
                  path: `artifacts/ui-validation/commerce-${slug}-catalog-failure.png`,
                  fullPage: false,
                });
                const catalogBody = (await page.locator("body").innerText()).slice(0, 600);
                throw new Error(
                  `${slug}: hero do catálogo ausente em ${page.url()} · ${catalogBody}`,
                );
              }
              if ((await page.getByTestId("catalog-feature-context").count()) !== 1) {
                throw new Error(`${slug}: produto em destaque continua sem contexto`);
              }

              const productLinks = page.locator('a[href*="/produto/"]');
              if ((await productLinks.count()) < 4) {
                throw new Error(`${slug}: catálogo tem menos de quatro cards interativos`);
              }
            }

            await page.goto(new URL("/demo/moda/produtos", baseUrl).toString(), {
              waitUntil: "networkidle",
              timeout: 90_000,
            });
            const fashionShellBackground = await page.locator("main").first().evaluate(
              (element) => getComputedStyle(element).backgroundColor,
            );
            const fashionChannels = fashionShellBackground.match(/\d+(?:\.\d+)?/g)?.slice(0, 3).map(Number) ?? [];
            if (fashionChannels.length === 3 && fashionChannels.every((value) => value > 225)) {
              throw new Error(`Maison Belle ainda usa fundo branco ofuscante: ${fashionShellBackground}`);
            }
            await page.screenshot({
              path: "artifacts/ui-validation/commerce-fashion-catalog.png",
              fullPage: false,
            });

            const firstFashionCard = page.locator('[data-niche="fashion"]').first();
            await firstFashionCard.scrollIntoViewIfNeeded();
            await page.waitForTimeout(650);
            const fashionCardGlow = await firstFashionCard.evaluate(
              (element) => getComputedStyle(element).boxShadow,
            );
            if (!fashionCardGlow || fashionCardGlow === "none") {
              throw new Error("Cards Maison Belle não exibem borda luminosa");
            }
            await page.screenshot({
              path: "artifacts/ui-validation/commerce-fashion-cards.png",
              fullPage: false,
            });
            const fashionFooter = page.locator("footer").first();
            await fashionFooter.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const fashionFooterBackground = await fashionFooter.evaluate(
              (element) => getComputedStyle(element).backgroundColor,
            );
            const footerChannels =
              fashionFooterBackground.match(/\d+(?:\.\d+)?/g)?.slice(0, 3).map(Number) ?? [];
            if (footerChannels.length === 3 && footerChannels.every((value) => value > 160)) {
              throw new Error(`Rodapé Maison Belle continua claro: ${fashionFooterBackground}`);
            }
            await page.screenshot({
              path: "artifacts/ui-validation/commerce-fashion-footer.png",
              fullPage: false,
            });

            const firstFashionProduct = await page.locator('a[href*="/produto/"]').first().getAttribute("href");
            if (!firstFashionProduct) {
              throw new Error("Maison Belle não expôs um produto navegável");
            }
            await page.goto(new URL(firstFashionProduct, baseUrl).toString(), {
              waitUntil: "networkidle",
              timeout: 90_000,
            });

            const productHeading = page.getByRole("heading", { level: 1 });
            const productWeight = Number(await productHeading.evaluate(
              (element) => getComputedStyle(element).fontWeight,
            ));
            if (productWeight < 500) {
              throw new Error(`Tipografia do produto Maison Belle ainda está fina: ${productWeight}`);
            }

            await page.getByRole("button", { name: /Adicionar ao carrinho/i }).click();
            await page.goto(new URL("/demo/moda/carrinho", baseUrl).toString(), {
              waitUntil: "networkidle",
              timeout: 90_000,
            });
            await page.getByTestId("premium-cart").waitFor({ state: "visible" });
            if (!(await page.getByText("Resumo em tempo real").isVisible())) {
              throw new Error("Carrinho premium não exibiu o resumo animado");
            }
            await page.screenshot({
              path: "artifacts/ui-validation/commerce-fashion-cart.png",
              fullPage: false,
            });

            await page.goto(new URL("/demo/barbearia", baseUrl).toString(), {
              waitUntil: "networkidle",
              timeout: 90_000,
            });
            await page.evaluate(() => {
              const key = "vitrine:barbearia:professionals";
              const stored = JSON.parse(localStorage.getItem(key) ?? "[]");
              localStorage.setItem(key, JSON.stringify(stored.slice(0, 2)));
              localStorage.setItem("vitrine:barbearia:media-version", "4");
            });
            await page.reload({ waitUntil: "networkidle" });
            const restoredProfessionals = await page.evaluate(
              () => JSON.parse(localStorage.getItem("vitrine:barbearia:professionals") ?? "[]").length,
            );
            if (restoredProfessionals !== 3) {
              throw new Error(
                `Migração da barbearia restaurou ${restoredProfessionals} profissionais, esperado 3`,
              );
            }
            const professionalButtons = page.getByRole("button", {
              name: /Rafael|Lucas|Diego/i,
            });
            if ((await professionalButtons.count()) !== 3) {
              throw new Error("Seletor visual da barbearia não mostra os três profissionais");
            }
            await professionalButtons.first().scrollIntoViewIfNeeded();
            await page.waitForTimeout(650);
            await page.screenshot({
              path: "artifacts/ui-validation/commerce-barber-professionals.png",
              fullPage: false,
            });

            const mobileContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              hasTouch: true,
              isMobile: true,
            });
            const mobilePage = await mobileContext.newPage();
            await mobilePage.goto(baseUrl, { waitUntil: "networkidle", timeout: 90_000 });
            await mobilePage.waitForFunction(
              () => document.documentElement.dataset.cinematicReady === "true",
            );
            const mobileQuality = await mobilePage.locator("html").getAttribute("data-motion-quality");
            if (mobileQuality !== "economy") {
              throw new Error(`Mobile deveria usar movimento econômico, encontrado: ${mobileQuality}`);
            }
            const directStoreLinks = mobilePage.locator(
              '#inicio [role="group"] a[href^="/demo/"]',
            );
            if ((await directStoreLinks.count()) !== 4) {
              throw new Error("Showroom mobile não expôs quatro links diretos e tocáveis");
            }
            await directStoreLinks.first().scrollIntoViewIfNeeded();
            await mobilePage.screenshot({
              path: "artifacts/ui-validation/mobile-direct-store-links.png",
              fullPage: false,
            });
            await directStoreLinks.first().click();
            await mobilePage.waitForURL(/\/demo\//, { timeout: 20_000 });
            if ((await mobilePage.locator('[data-testid="store-cursor-shader"] canvas').count()) !== 0) {
              throw new Error("Shader WebGL do cursor foi iniciado no touch");
            }
            await mobilePage.goto(new URL("/demo/restaurante/produtos", baseUrl).toString(), {
              waitUntil: "networkidle",
              timeout: 90_000,
            });
            const compactCatalogHeight = await mobilePage
              .getByTestId("catalog-expansion-hero")
              .evaluate((element) => element.getBoundingClientRect().height);
            if (compactCatalogHeight > 900) {
              throw new Error(`Hero mobile ainda prende scroll demais: ${compactCatalogHeight}px`);
            }
            await mobileContext.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Copy server log
        if: always()
        run: |
          mkdir -p artifacts/ui-validation
          cp /tmp/vitrine-server.log artifacts/ui-validation/server.log || true

      - name: Upload validation screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-validation
          path: artifacts/ui-validation
          if-no-files-found: warn
          retention-days: 14
