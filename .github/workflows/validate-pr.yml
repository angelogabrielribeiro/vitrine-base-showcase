name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  lint:
    name: Validate changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate exact validation script formatting
        run: npx prettier --write scripts/validate-ui.mjs

      - name: Upload formatted validation script
        uses: actions/upload-artifact@v5
        with:
          name: formatted-validation-script
          path: scripts/validate-ui.mjs
          retention-days: 1

      - name: Check committed interface formatting
        run: |
          npx prettier --check \
            .github/workflows/validate-pr.yml \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Lint changed interface files
        run: |
          npx eslint \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Validate browser script syntax
        run: node --check scripts/validate-ui.mjs

      - name: Report existing repository lint debt
        continue-on-error: true
        run: npm run lint

  ui:
    name: Validate animations and responsive states
    needs:
      - build
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install matching Playwright library
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Start application server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vitrine-server.log 2>&1 &
          echo $! > /tmp/vitrine-server.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vitrine-server.log
          exit 1

      - name: Run browser validation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-ui.mjs

      - name: Copy server log
        if: always()
        run: |
          mkdir -p artifacts/ui-validation
          cp /tmp/vitrine-server.log artifacts/ui-validation/server.log || true

      - name: Upload validation screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-validation
          path: artifacts/ui-validation
          if-no-files-found: warn
          retention-days: 14
