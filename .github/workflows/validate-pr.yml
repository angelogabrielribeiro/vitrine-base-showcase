name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  motion-hydration-fix:
    name: Apply hydration-safe motion preference
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply targeted motion replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path("src/routes/index.tsx"): [
                  (
                      'import { motion, useReducedMotion } from "framer-motion";',
                      'import { motion } from "framer-motion";',
                  ),
                  (
                      'import { ScrollExpandShowcase } from "@/components/marketing/scroll-expand-showcase";\n',
                      'import { ScrollExpandShowcase } from "@/components/marketing/scroll-expand-showcase";\nimport { useCinematicMotion } from "@/components/motion/cinematic-motion-system";\n',
                  ),
                  (
                      '  const reduceMotion = useReducedMotion();',
                      '  const { capabilities } = useCinematicMotion();\n  const reduceMotion = capabilities.hydrated && capabilities.reducedMotion;',
                  ),
              ],
              Path("src/components/marketing/scroll-expand-showcase.tsx"): [
                  (
                      'import { motion, useReducedMotion, useScroll, useTransform } from "framer-motion";',
                      'import { motion, useScroll, useTransform } from "framer-motion";',
                  ),
                  (
                      'import { useRef } from "react";\n',
                      'import { useRef } from "react";\nimport { useCinematicMotion } from "@/components/motion/cinematic-motion-system";\n',
                  ),
                  (
                      '  const reduceMotion = useReducedMotion();',
                      '  const { capabilities } = useCinematicMotion();\n  const reduceMotion = capabilities.hydrated && capabilities.reducedMotion;',
                  ),
              ],
              Path("src/components/system/not-found-page.tsx"): [
                  (
                      'import { motion, useReducedMotion } from "framer-motion";',
                      'import { motion } from "framer-motion";',
                  ),
                  (
                      'import { ArrowLeft, Compass, Home, LayoutGrid, MapPin } from "lucide-react";\n',
                      'import { ArrowLeft, Compass, Home, LayoutGrid, MapPin } from "lucide-react";\nimport { useCinematicMotion } from "@/components/motion/cinematic-motion-system";\n',
                  ),
                  (
                      '  const reduceMotion = useReducedMotion();',
                      '  const { capabilities } = useCinematicMotion();\n  const reduceMotion = capabilities.hydrated && capabilities.reducedMotion;',
                  ),
              ],
          }

          changed = False
          for path, replacements in changes.items():
              text = path.read_text()
              original = text
              for old, new in replacements:
                  count = text.count(old)
                  if count == 1:
                      text = text.replace(old, new)
                  elif count == 0 and new in text:
                      continue
                  else:
                      raise SystemExit(f"Replacement mismatch in {path}: expected one occurrence, found {count}: {old}")
              if text != original:
                  path.write_text(text)
                  changed = True

          print("Motion hydration files updated." if changed else "Motion hydration files already updated.")
          PY

      - name: Commit hydration fix
        run: |
          if git diff --quiet; then
            echo "No hydration changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/index.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx
          git commit -m "Make reduced motion hydration safe"
          git push

  build:
    name: Build application
    needs: motion-hydration-fix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  lint:
    name: Validate changed files
    needs: motion-hydration-fix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: |
          npx prettier --check \
            .github/workflows/validate-pr.yml \
            scripts/validate-ui.mjs \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Lint changed interface files
        run: |
          npx eslint \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Validate browser script syntax
        run: node --check scripts/validate-ui.mjs

      - name: Report existing repository lint debt
        continue-on-error: true
        run: npm run lint

  ui:
    name: Validate animations and responsive states
    needs:
      - build
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install matching Playwright library
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0

      - name: Start application server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vitrine-server.log 2>&1 &
          echo $! > /tmp/vitrine-server.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vitrine-server.log
          exit 1

      - name: Run browser validation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-ui.mjs

      - name: Copy server log
        if: always()
        run: |
          mkdir -p artifacts/ui-validation
          cp /tmp/vitrine-server.log artifacts/ui-validation/server.log || true

      - name: Upload validation screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-validation
          path: artifacts/ui-validation
          if-no-files-found: warn
          retention-days: 14
