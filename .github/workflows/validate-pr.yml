name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format changed interface files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format files changed by this pull request
        run: |
          npx prettier --write \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Commit formatting adjustments
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx
          git commit -m "Format homepage validation files"
          git push

  build:
    name: Build application
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  lint:
    name: Lint changed interface files
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint files changed by this pull request
        run: |
          npx eslint \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            src/components/marketing/scroll-expand-showcase.tsx \
            src/components/system/not-found-page.tsx

      - name: Report existing repository lint debt
        continue-on-error: true
        run: npm run lint
