name: Validate product image upload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed file
        run: bunx prettier --write src/components/admin/product-form.tsx
      - name: Commit formatting when needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/admin/product-form.tsx
            git commit -m "Format product image upload"
            git push
          fi
      - name: ESLint
        run: bunx eslint src/components/admin/product-form.tsx
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
